services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: peopleflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peopleflow}
      POSTGRES_DB: peopleflow
    ports: ['127.0.0.1:5432:5432']
    volumes: ['peopleflow_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peopleflow']
      interval: 5s
      retries: 10
volumes:
  peopleflow_pg:
